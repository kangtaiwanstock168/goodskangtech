<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120e0a">
<title>漫畫讀經｜一天一章，用漫畫讀聖經</title>
<meta name="description" content="給青少年的漫畫讀經：創世記、士師記，一天一章。每一格漫畫配和合本經文，有小遊戲，也有白話的深度解析。">
<meta property="og:title" content="漫畫讀經｜一天一章，用漫畫讀聖經">
<meta property="og:description" content="每一格漫畫配和合本經文，翻頁像看漫畫書，還有小遊戲和深度解析。">
<meta property="og:image" content="https://goodskang.tw/bible/genesis/img/cover-1.webp">
<meta property="og:type" content="website">
<meta property="og:url" content="https://goodskang.tw/bible/">
<link rel="canonical" href="https://goodskang.tw/bible/">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="漫畫讀經">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e0a;--line:#3d3124;--brass:#c9a35a;--brass2:#e8c983;--parch:#efe3c8;--dim:#a8977a;--serif:"Noto Serif TC",serif;--sans:"Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--parch);font-family:var(--sans);font-size:16px;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,8vw,54px);color:#ffe3a0;margin:0;letter-spacing:4px;text-wrap:balance}
.sub{font-family:var(--serif);font-size:17px;color:var(--parch);margin:4px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
.bk{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:3/4.3;border-radius:10px;border:1px solid #4a3b28;overflow:hidden;text-decoration:none;color:#fff;background:#2a2119 center/cover;box-shadow:0 8px 20px rgba(0,0,0,.55);padding:12px}
.bk:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(10,6,3,.94))}
.bk>*{position:relative}
.bk b{font-family:var(--serif);font-size:clamp(22px,5vw,28px);font-weight:900;color:#fff3d6;line-height:1.2;text-shadow:0 2px 6px #000}
.bk span{font-size:13px;color:#ffe3a0}
.bk .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:6px;overflow:hidden}
.bk .bar i{display:block;height:100%;background:var(--brass2)}
.bk.soon{background:repeating-linear-gradient(135deg,#1c1611,#1c1611 12px,#211a13 12px,#211a13 24px);border-style:dashed;color:var(--dim)}
.bk.soon:before{display:none}.bk.soon b{color:var(--dim);text-shadow:none}.bk.soon span{color:var(--dim)}
.bk .tag{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:#b8452a;color:#fff;border-radius:10px;padding:0 9px}
.card{background:#1c1611;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:22px}
.card h2{font-family:var(--serif);font-size:19px;margin:0 0 6px;color:var(--brass2)}
.card ol{margin:4px 0;padding-left:22px}.card p{margin:6px 0 0;color:var(--dim);font-size:14px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:22px}
.how div{background:#1c1611;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.how b{display:block;font-family:var(--serif);color:var(--brass2);font-size:17px}
.how span{font-size:14px;color:var(--dim)}
.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
<h1>漫畫讀經</h1>
<div class="sub">一天一章，用漫畫把聖經讀完</div>
<div class="grid" id="grid"></div>
<div class="how"><div><b>📖 像看漫畫書</b><span>左右滑翻頁，每一格下面都是真的和合本經文。</span></div><div><b>🎮 有小遊戲</b><span>每一章兩三個小關卡，邊玩邊記住剛剛讀到什麼。</span></div><div><b>📚 深度解析</b><span>每章最後用白話講背景，和聖經為什麼這樣寫。</span></div></div>
<div class="card" id="tip" hidden></div>
<p class="foot">經文：和合本。閱讀進度只存在這台裝置。</p>
</div>
<script>
const BOOKS=[["genesis","創世記","genesis_comic_v1",50,50,"cover-1.webp"],["exodus","出埃及記","exodus_comic_v1",31,40,"cover-3.webp"],["judges","士師記","judges_comic_v3",21,21,"cover-7.webp"],["daniel","但以理書","",0,12,""],["mark","馬可福音","",0,16,""]];
function done(k){try{const s=JSON.parse(localStorage.getItem(k)||"{}");return Object.values(s.ch||{}).filter(c=>c.done).length;}catch(e){return 0;}}
document.getElementById("grid").innerHTML=BOOKS.map(([id,nm,key,live,total,cv])=>{if(!live)return `<div class="bk soon"><b>${nm}</b><span>${total} 章・製作中</span></div>`;const d=done(key);
 return `<a class="bk" href="${id}/" style="background-image:url(${id}/img/${cv})">${live<total?`<i class="tag" style="font-style:normal">連載中</i>`:""}<b>${nm}</b><span>${d?`讀完 ${d} / ${live} 章`:live<total?`已上架 ${live} / ${total} 章`:`${total} 章`}</span><div class="bar"><i style="width:${d/live*100}%"></i></div></a>`;}).join("");
const SA=(window.matchMedia&&matchMedia("(display-mode:standalone),(display-mode:fullscreen)").matches)||navigator.standalone===true,IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
if(!SA&&(navigator.maxTouchPoints||0)>0){const t=document.getElementById("tip");t.hidden=false;t.innerHTML=`<h2>📲 想讓整個螢幕都是漫畫？</h2>`+(IOS?`<ol><li>用 <b>Safari</b> 打開這一頁</li><li>點 <b>分享</b>（方框加箭頭的圖示）</li><li>選 <b>加入主畫面</b>，再按「加入」</li></ol><p>之後從主畫面的圖示打開，就沒有網址列和分頁列，像一個 App。</p>`:`<ol><li>點瀏覽器右上角的 <b>⋮</b></li><li>選 <b>加到主畫面</b> 或 <b>安裝應用程式</b></li></ol><p>之後從主畫面的圖示打開就是全螢幕。</p>`);}
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
</script>
</body>
</html>
