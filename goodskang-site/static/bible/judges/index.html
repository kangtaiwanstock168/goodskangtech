<!DOCTYPE html>
<html lang="zh-Hant">

<meta property="og:title" content="士師記漫畫讀經｜21 天一天一章">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e0a;--panel:#1c1611;--panel2:#241c15;--line:#3d3124;--brass:#c9a35a;--brass2:#e8c983;--parch:#efe3c8;--dim:#a8977a;--red:#b8452a;--green:#6fbf6a;--paper:#f4ead3;--ink:#1d140c;--serif:"Noto Serif TC",serif;--sans:"Noto Sans TC",system-ui,sans-serif;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--parch);font-family:var(--sans);font-size:16px;line-height:1.7}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.35;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--brass);background:linear-gradient(#3a2a18,#22180f);color:var(--brass2);font-family:var(--serif);font-weight:700;font-size:17px}
.btn.pri{background:linear-gradient(#b07c2e,#7a4f16);color:#fff6dc;border-color:#e8c983}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--parch)}
.btn.wide{width:100%}
.btn:active{transform:scale(.97)}
.icon{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--parch)}
.note{font-size:14px;color:var(--dim)}
/* ================= 首頁 ================= */
#home{display:none}#home.on{display:block}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(40px + var(--sb))}
.hero{position:relative;margin:0 -16px;height:min(62vh,520px);overflow:hidden}
.hero .bg{position:absolute;inset:0;background:center 30%/cover no-repeat;filter:saturate(1.05)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,10,.55) 0%,rgba(18,14,10,0) 30%,rgba(18,14,10,.2) 60%,var(--bg) 100%)}
.hero .txt{position:absolute;left:0;right:0;top:calc(26px + var(--st));text-align:center;padding:0 16px}
.hero h1{font-size:44px;font-weight:900;color:#ffe3a0;text-shadow:0 3px 0 #000,0 0 26px rgba(0,0,0,.9);letter-spacing:4px}
.hero .sub{font-family:var(--serif);font-size:17px;text-shadow:0 2px 6px #000}
.today{position:relative;margin-top:-70px;display:flex;gap:14px;align-items:stretch;background:linear-gradient(160deg,#2c2115,#1c1611);border:1px solid var(--brass);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.today .cv{width:92px;flex:none;border-radius:10px;background:center/cover;border:1px solid #5a4a33;aspect-ratio:3/4}
.today .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.today .lab{font-size:12px;color:var(--brass);letter-spacing:2px}
.today h2{font-size:22px;margin:2px 0}
.today .meta{font-size:13px;color:var(--dim);margin-bottom:10px;flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:24px;color:var(--brass2);line-height:1.2}
.stat span{font-size:12px;color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card h3{font-size:19px;color:var(--brass2);margin-bottom:6px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.bk{position:relative;aspect-ratio:3/4;border-radius:8px;border:1px solid #4a3b28;background:#2a2119 center/cover;overflow:hidden;padding:0;text-align:left;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.bk:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.85))}
.bk b{position:absolute;left:6px;right:6px;bottom:4px;z-index:1;font-family:var(--serif);font-size:13px;line-height:1.3;color:#fff3d6;text-shadow:0 1px 3px #000}
.bk i{position:absolute;top:5px;left:6px;z-index:1;font-style:normal;font-size:11px;background:rgba(0,0,0,.6);border-radius:10px;padding:0 7px;color:#ffe3a0}
.bk .ok{position:absolute;top:5px;right:5px;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--green);color:#0d1f0a;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:900}
.bk.cur{outline:2px solid var(--brass2);outline-offset:2px;animation:glow 1.6s infinite}
@keyframes glow{50%{outline-color:rgba(232,201,131,.3)}}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;color:var(--dim);font-size:14px}
.seg button.on{background:var(--brass);color:#1a1209;font-weight:700}
details.intro summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;font-family:var(--serif);font-weight:700;font-size:18px;color:var(--brass2)}
details.intro summary::-webkit-details-marker{display:none}
details.intro summary:after{content:"＋";color:var(--brass)}details.intro[open] summary:after{content:"－"}
.cycle{display:block;width:100%;max-width:360px;margin:6px auto 0}
/* ================= 閱讀器 ================= */
#reader{position:fixed;inset:0;display:none;background:radial-gradient(circle at 50% 40%,#241b12,#070504 80%);z-index:30;overflow:hidden}
#reader.on{display:block}
.rbar,.rfoot{position:absolute;left:0;right:0;z-index:45;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.rbar{top:0;padding:calc(8px + var(--st)) 10px 18px;background:linear-gradient(rgba(0,0,0,.82),rgba(0,0,0,0));transform:translateY(-8px)}
.rfoot{bottom:0;padding:18px 12px calc(8px + var(--sb));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.82));transform:translateY(8px)}
#reader.ui .rbar,#reader.ui .rfoot{opacity:1;pointer-events:auto;transform:none}
.rbar .icon,.rfoot .icon{background:rgba(28,22,17,.85)}
.rbar .t{flex:1;min-width:0;font-family:var(--serif);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.rbar .pn{font-size:13px;color:#e8d8b8;white-space:nowrap;text-shadow:0 1px 3px #000}
#stage{position:absolute;left:0;right:0;top:var(--st);bottom:var(--sb);display:flex;align-items:center;justify-content:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden}
#stage.scroll{display:block;overflow-y:auto;overflow-x:hidden;touch-action:auto;-webkit-overflow-scrolling:touch;padding:62px 0 70px}
#meas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
#meas .pg{position:absolute;inset:0}
.book{position:relative}
.slot{position:absolute;top:0;height:100%}
.slot .shade{position:absolute;inset:0;pointer-events:none;z-index:20;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 55%)}
.leaf{position:absolute;top:0;height:100%;transform-style:preserve-3d;z-index:8;pointer-events:none}
.st{position:absolute;top:0;height:100%;transform-style:preserve-3d;will-change:transform}
.st .f{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.st .fb{transform:rotateY(180deg)}
.st .hold{position:absolute;top:0;height:100%}
.st .hold.blank{background:linear-gradient(90deg,#e9dcc0,#f4ead3)}
.st .hold .pg{box-shadow:none}
.st .sh{position:absolute;inset:0;pointer-events:none}
.cast{position:absolute;top:0;height:100%;z-index:7;pointer-events:none;opacity:0;filter:blur(6px)}
.spine{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;z-index:9;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.28) 46%,rgba(255,255,255,.07) 52%,rgba(0,0,0,.12) 58%,rgba(0,0,0,0))}
.rfoot .pb{flex:1;height:6px;border-radius:4px;background:rgba(60,48,36,.8);overflow:hidden}
.rfoot .pb i{display:block;height:100%;background:linear-gradient(90deg,#a8742a,#e8c983);transition:width .3s}
.hint{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#ffe3a0;font-size:13px;padding:6px 14px;border-radius:20px;pointer-events:none;z-index:46;white-space:nowrap;animation:hintA 4s forwards}
@keyframes hintA{0%,80%{opacity:1}100%{opacity:0}}
.bleed .book .pg{border-radius:0;box-shadow:none}
.pg:not(.play) .bb,.pg:not(.play) .sfx{opacity:0}
/* ================= 頁面 ================= */
.pg{position:absolute;inset:0;background:var(--paper);color:var(--ink);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6);container-type:inline-size}
.scroll .pg{position:relative;inset:auto;margin:0 auto 16px;border-radius:10px}
.pg .pno{position:absolute;bottom:4px;right:10px;font-size:11px;color:#8a7a60;z-index:3}
.panel{position:relative;flex:1 1 0;min-height:36%;margin:10px 10px 0;border:3px solid var(--ink);border-radius:4px;overflow:hidden;background:#88a;isolation:isolate}
.scroll .panel{flex:none;aspect-ratio:4/3.6}
.sky{position:absolute;inset:0}
.m-day .sky{background:linear-gradient(#7fb6e0,#d9e8ea 55%,#f2e2b8)}
.m-dusk .sky{background:linear-gradient(#4a3a6a,#c26a48 45%,#f2b26a)}
.m-night .sky{background:linear-gradient(#050a1c,#18244a 60%,#2a3460)}
.m-dark .sky{background:linear-gradient(#140d08,#3a2818)}
.m-storm .sky{background:linear-gradient(#2a323c,#5a6570 60%,#7a8590)}
.m-gold .sky{background:radial-gradient(circle at 50% 0%,#fff6d8,#f2cf7a 40%,#b8803a)}
.m-war .sky{background:linear-gradient(#5a2418,#b8643a 50%,#e2a066)}
.gnd{position:absolute;left:-30%;right:-30%;bottom:-6%;height:42%;background-size:160px;transform:perspective(260px) rotateX(48deg);transform-origin:50% 100%}
.gnd:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 40%)}
.gnd.in{background:linear-gradient(#3a2a1a,#1e150d)}
.wall{position:absolute;left:0;right:0;top:0;height:72%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 64px),linear-gradient(#2c2016,#4a3626)}
.m-night .gnd,.m-night .c,.m-night .pr{filter:brightness(.55) saturate(.7) hue-rotate(-10deg)}
.m-dark .c,.m-dark .pr{filter:brightness(.8)}
.m-dusk .c{filter:sepia(.15) saturate(1.1)}
.pr,.c{position:absolute;bottom:8%;transform:translateX(-50%);max-width:none;pointer-events:none}
.pr{bottom:12%;z-index:1}
.c{z-index:2;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.c.fl{transform:translateX(-50%) scaleX(-1)}
.c.emo{font-size:20cqw;line-height:1;height:auto!important;bottom:10%}
.play .c{animation:cin .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d)}
.play .c.fr{animation-name:cinR}
@keyframes cin{from{opacity:0;translate:-30cqw 0}to{opacity:1;translate:0 0}}
@keyframes cinR{from{opacity:0;translate:30cqw 0}to{opacity:1;translate:0 0}}
.cap{position:absolute;left:3%;right:3%;bottom:3%;z-index:8;background:#f7e6a8;border:2px solid var(--ink);padding:6px 10px;font-family:var(--serif);font-weight:700;font-size:clamp(13px,3.6cqw,18px);line-height:1.5;box-shadow:3px 3px 0 rgba(0,0,0,.6);border-radius:2px}
.bb{position:absolute;z-index:9;width:46%;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:7px 11px;font-weight:700;font-size:clamp(13px,3.7cqw,18px);line-height:1.45;box-shadow:2px 3px 0 rgba(0,0,0,.35)}
.bb:after{content:"";position:absolute;bottom:-13px;left:var(--tx);width:16px;height:16px;background:#fff;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg) skew(12deg,12deg)}
.bb.god{width:74%;left:13%!important;background:radial-gradient(#fffdf0,#ffeeb8);border-color:#c9902a;text-align:center;font-family:var(--serif);font-size:clamp(15px,4.4cqw,22px);box-shadow:0 0 22px rgba(255,220,120,.9)}
.bb.god:after{display:none}
.play .bb{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.sfx{position:absolute;z-index:7;transform:translate(-50%,-50%) rotate(-9deg);font-family:var(--sans);font-weight:900;font-size:clamp(28px,11cqw,64px);color:#ffde4a;-webkit-text-stroke:3px #2a0a00;paint-order:stroke fill;text-shadow:4px 4px 0 #2a0a00;white-space:nowrap;letter-spacing:-1px}
.play .sfx{animation:punch .5s .45s cubic-bezier(.3,1.8,.5,1) both}
@keyframes punch{from{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(2.6)}}
/* 特效 */
.fx{position:absolute;inset:0;pointer-events:none}
.fx-rays{z-index:1;background:repeating-conic-gradient(from 0deg at 50% -5%,rgba(255,245,210,.22) 0 3deg,rgba(255,250,220,0) 3deg 11deg);mix-blend-mode:screen;mask:linear-gradient(#000,transparent 75%);-webkit-mask:linear-gradient(#000,transparent 75%);animation:spin 30s linear infinite}
@keyframes spin{to{filter:hue-rotate(10deg)}}
.fx-rain{z-index:6;background:repeating-linear-gradient(105deg,rgba(220,235,255,.55) 0 1px,transparent 1px 14px);background-size:200% 200%;animation:rain .5s linear infinite;opacity:.8}
@keyframes rain{to{background-position:-40px 120px}}
.fx-fire{z-index:6;background:radial-gradient(ellipse at 50% 110%,rgba(255,120,20,.75),rgba(255,60,0,.25) 45%,transparent 70%);mix-blend-mode:screen;animation:flick 1.2s infinite alternate}
@keyframes flick{50%{opacity:.7}to{opacity:1;transform:scaleY(1.05)}}
.fx-torch{z-index:6;background:radial-gradient(circle at 22% 45%,rgba(255,170,60,.7),transparent 14%),radial-gradient(circle at 50% 40%,rgba(255,170,60,.7),transparent 14%),radial-gradient(circle at 76% 46%,rgba(255,170,60,.7),transparent 14%);mix-blend-mode:screen;animation:flick .4s infinite alternate}
.fx-speed{z-index:1;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.35) 0 1.5deg,transparent 1.5deg 7deg);mask:radial-gradient(circle,transparent 30%,#000 70%);-webkit-mask:radial-gradient(circle,transparent 30%,#000 70%)}
.fx-vignette{z-index:6;background:radial-gradient(circle,transparent 30%,rgba(0,0,0,.85) 80%)}
.play.fx-shake .panel,.panel.fx-shake{animation:shk .5s .4s}
@keyframes shk{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.panel.big .cap{top:30%;bottom:auto;text-align:center;font-size:clamp(20px,7cqw,34px);background:#1d140c;color:#ffe3a0;border-color:#c9a35a}
.panel.ill{background:#2a2016}
.illimg{pointer-events:none;-webkit-user-drag:none;user-select:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;transform-origin:50% 40%}
.play .illimg{animation:kb 12s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.panel.ill .bb{width:min(56%,300px)}
.bb.r{left:auto}
.talk{position:relative;z-index:9;flex:none;margin:-30px 16px 0;display:flex;flex-direction:column;gap:7px}
.talk .bb{position:relative;width:auto;max-width:84%;align-self:flex-start;left:auto;top:auto}
.talk .bb.r{align-self:flex-end}
.talk .bb:after{top:-11px;bottom:auto;left:26px;border:0;border-left:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:rotate(45deg) skew(8deg,8deg)}
.talk .bb.r:after{left:auto;right:26px}
.talk .bb.god{align-self:center;max-width:92%;width:auto;left:auto!important}
.talk .cap{position:static;margin:0}
.talk.big .cap{text-align:center;font-size:clamp(20px,6.4cqw,32px);background:#1d140c;color:#ffe3a0;border-color:#c9a35a;padding:14px}
.panel.ill .sfx{top:auto;bottom:16%;transform:translate(-50%,0) rotate(-8deg);font-size:clamp(24px,9cqw,54px)}
.play .panel.ill .sfx{animation:punch2 .5s .45s cubic-bezier(.3,1.8,.5,1) both}
@keyframes punch2{from{opacity:0;transform:translate(-50%,0) rotate(-8deg) scale(2.4)}}
/* 深度解析 */
#deep{position:fixed;inset:0;z-index:70;display:none;background:rgba(8,6,4,.86);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#deep.on{display:block}
.dwrap{max-width:760px;margin:0 auto;background:var(--paper);color:var(--ink);min-height:100%;position:relative}
.dhead{position:relative;height:min(46vh,340px);background:#2a2016 center 28%/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px 16px;color:#fff}
.dhead:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.2) 40%,rgba(20,12,6,.94))}
.dhead>*{position:relative}
.dhead small{letter-spacing:3px;color:#ffe3a0;font-size:13px}
.dhead h1{font-size:clamp(26px,7vw,40px);font-weight:900;color:#fff6dc;text-shadow:0 2px 8px #000}
.dx{position:fixed;top:calc(10px + var(--st));right:max(10px,calc(50vw - 370px));z-index:72;width:46px;height:46px;border-radius:50%;border:1px solid #e8c983;background:rgba(18,14,10,.9);color:#fff;font-size:20px}
.dbody{padding:18px 20px 40px;font-size:17px;line-height:1.9}
.dlead{font-family:var(--serif);font-weight:700;font-size:clamp(18px,4.6vw,21px);line-height:1.75;border-left:4px solid #a8742a;padding:4px 0 4px 14px;margin:4px 0 18px}
.dsec{background:#fffaf0;border:2px solid #2a1d12;border-radius:14px;padding:14px 16px 6px;margin:0 0 14px;box-shadow:4px 4px 0 #2a1d12}
.dsec h3{display:flex;align-items:center;gap:10px;font-size:clamp(18px,4.8vw,22px);margin:0 0 8px}
.dsec h3 i{font-style:normal;flex:none;width:30px;height:30px;border-radius:50%;background:#b8452a;color:#fff;font-family:var(--sans);font-size:15px;display:flex;align-items:center;justify-content:center}
.dsec p{margin:0 0 10px}
.dsec.last{background:#fff3cf;border-color:#a8742a;box-shadow:4px 4px 0 #a8742a}
.dsec.last h3 i{background:#a8742a}
.dmore h3{font-size:18px;margin:22px 0 8px;color:#7a4f16}
.dmore table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.dmore th,.dmore td{border:1px solid #d6c39a;padding:7px;vertical-align:top;word-break:break-word;text-align:left;line-height:1.55}
.dmore th{background:#efe0bc}
.dmore .rf{background:#fffaf0;border:1px solid #d6c39a;border-radius:10px;padding:9px 12px;margin:0 0 8px;font-size:15px;line-height:1.7}
.dmore .rf b{display:block;color:#7a4f16;font-family:var(--serif)}

<script>
"use strict";
const $=id=>document.getElementById(id);
let A=window.ASSET||{art:{},gtex:{},town:{},props:{}};const JDG=window.JDG,EASY=window.EASY,COMIC=window.COMIC;
const COVER=new Proxy({},{get:(o,k)=>(/^\d+$/.test(k)?`img/cover-${k}.webp`:(["lion","fox","bee"].includes(k)?`img/${k}.webp`:undefined))});
// ---------- 存檔（只存在這台裝置） ----------
const SK="judges_comic_v3";let SAVE={ch:{},days:[],mode:""};
try{const r=localStorage.getItem(SK);if(r)SAVE=Object.assign(SAVE,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(SK,JSON.stringify(SAVE));}catch(e){}}
const st=n=>SAVE.ch[n]||(SAVE.ch[n]={done:0,games:{},page:0,note:"",ch:0});
const doneCount=()=>CH.filter(c=>SAVE.ch[c.n]&&SAVE.ch[c.n].done).length;
const gamesDone=()=>Object.values(SAVE.ch).reduce((a,s)=>a+Object.keys(s.games||{}).length,0);
const gamesTotal=()=>Object.values(COMIC).reduce((a,l)=>a+l.filter(x=>!Array.isArray(x)).length,0);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
function streak(){const set=new Set(SAVE.days);let s=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);while(set.has(d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate())){s++;d.setDate(d.getDate()-1);}return s;}
const starHTML=()=>"";
// ---------- 音效 ----------
const AU={ctx:null};
function au(){if(!AU.ctx){try{AU.ctx=new (window.AudioContext||window.webkitAudioContext)();AU.m=AU.ctx.createGain();AU.m.gain.value=.5;AU.m.connect(AU.ctx.destination);}catch(e){}}if(AU.ctx&&AU.ctx.state==="suspended")AU.ctx.resume();return AU.ctx;}
function tone(t,type,f0,f1,d,v){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+d+.02);}
function noise(t,d,ft,f0,f1,v){const c=AU.ctx,L=Math.floor(c.sampleRate*d),b=c.createBuffer(1,L,c.sampleRate),ch=b.getChannelData(0);for(let i=0;i<L;i++)ch[i]=(Math.random()*2-1)*(1-i/L);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=ft;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(AU.m);s.start(t);}
const SFX={hit(){const t=AU.ctx.currentTime,r=.9+Math.random()*.2;tone(t,"sine",190*r,48,.13,.5);noise(t,.07,"lowpass",4200,600,.38);},
 crit(){const t=AU.ctx.currentTime;tone(t,"sine",95,28,.3,.6);noise(t,.15,"lowpass",6500,300,.5);tone(t,"triangle",2600,2400,.25,.06);},
 kill(){const t=AU.ctx.currentTime;noise(t,.25,"lowpass",2800,120,.42);tone(t,"sine",150,30,.26,.45);},
 swing(){const t=AU.ctx.currentTime;noise(t,.14,"bandpass",900,5000,.35);},
 hurt(){const t=AU.ctx.currentTime;tone(t,"sawtooth",220,90,.18,.18);},
 horn(){const t=AU.ctx.currentTime;[0,.05,.1].forEach((d,i)=>{tone(t+d,"sawtooth",233+i*2,240,1.1,.09);tone(t+d,"square",466,470,1,.03);});},
 smash(){const t=AU.ctx.currentTime;noise(t,.3,"highpass",3000,1200,.5);tone(t,"triangle",900,300,.15,.15);},
 boom(){const t=AU.ctx.currentTime;tone(t,"sine",120,28,.6,.6);noise(t,.7,"lowpass",3000,80,.55);},
 spirit(){const t=AU.ctx.currentTime;[523,659,784,1047].forEach((f,i)=>tone(t+i*.06,"triangle",f,f,.6,.1));tone(t,"sine",80,40,.6,.4);},
 win(){const t=AU.ctx.currentTime;[392,523,659,784].forEach((f,i)=>tone(t+i*.12,"triangle",f,f,.5,.12));},
 page(){const t=AU.ctx.currentTime;noise(t,.28,"bandpass",1800,700,.22);noise(t+.05,.18,"highpass",5000,3000,.06);},
 pop(){const t=AU.ctx.currentTime;tone(t,"sine",520,900,.08,.08);},
 ok(){const t=AU.ctx.currentTime;[784,988,1319].forEach((f,i)=>tone(t+i*.07,"triangle",f,f,.3,.11));},
 bad(){const t=AU.ctx.currentTime;tone(t,"square",200,140,.15,.06);},
 tick(){const t=AU.ctx.currentTime;tone(t,"sine",1200,1100,.05,.05);}};
const sfx=k=>{if(au()&&SFX[k])try{SFX[k]();}catch(e){}};
const IMG={};function img(src){if(!IMG[src]){const i=new Image();i.src=src;IMG[src]=i;}return IMG[src];}

function confetti(){const c=document.createElement("div");c.className="confetti";const col=["#e8c983","#b8452a","#6fbf6a","#3f6a8a","#fff3d6"];for(let i=0;i<46;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=col[i%5];p.style.animationDelay=Math.random()*.5+"s";p.style.animationDuration=1.2+Math.random()+"s";c.appendChild(p);}document.body.appendChild(c);setTimeout(()=>c.remove(),2800);}
// ================= 首頁 =================

function coverURL(n){return COVER[n]||ART(CH[n-1].hero);}
function renderHome(){const n=nextCh(),c=CH[n-1],D=doneCount(),all=D===21,s=SAVE.ch[n],resume=s&&s.page>0&&!s.done;
 $("home").innerHTML=`<div class="wrap"><div class="hero"><div class="bg" style="background-image:url(${COVER[7]||A.gtex.forest})"></div><div class="shade"></div>
  <div class="txt"><h1>士師記</h1><div class="sub">漫畫讀經・21 天・一天一章</div></div></div>
 <div class="today"><div class="cv" style="background-image:url(${coverURL(n)})"></div><div class="bd"><div class="lab">${all?"全部讀完了":D?"今天讀這一章":"從這裡開始"}</div><h2>第 ${n} 章　${c.title}</h2><div class="meta">${c.who}・${COMIC[n].length} 頁漫畫＋小遊戲</div><button class="btn pri wide" data-open="${n}">${all?"再看一次":resume?"接著看":D?"翻開第 "+n+" 章":"翻開第一章"}</button></div></div>
 <div class="stats"><div class="stat"><b>${D}</b><span>讀完章數 / 21</span></div><div class="stat"><b>${streak()}</b><span>連續讀經天數</span></div><div class="stat"><b>${gamesDone()}</b><span>小遊戲過關 / ${gamesTotal()}</span></div></div>
 <div class="card"><h3>21 本漫畫</h3><p class="note" style="margin:0 0 10px">一章就是一本，⚔ 的章節可以親自上場打仗。</p>
  <div class="shelf">${CH.map(c=>{const d=SAVE.ch[c.n]&&SAVE.ch[c.n].done;return `<button class="bk ${c.n===n&&!all?"cur":""}" data-open="${c.n}" style="background-image:url(${coverURL(c.n)})" aria-label="第 ${c.n} 章 ${c.title}"><i>${c.n}${c.battle?" ⚔":""}</i>${d?`<span class="ok">✓</span>`:""}<b>${c.title}</b></button>`;}).join("")}</div></div>
 <div class="card"><h3>閱讀方式</h3><div class="seg"><button data-mode="flip" class="${R.mode==="flip"?"on":""}">📖 翻頁（像漫畫書）</button><button data-mode="scroll" class="${R.mode==="scroll"?"on":""}">📜 條漫（往下滑）</button></div><p class="note" style="margin:8px 0 0">iPad 橫放、Duo 打開橫拿、電腦會自動變成左右兩頁的跨頁。</p></div>
 <details class="card intro"${D?"":" open"}><summary>第一次讀士師記？先看這 1 分鐘</summary>
  <p>以色列人進了應許之地，可是摩西和約書亞都過世了。接下來大約三百年<b>沒有國王</b>，百姓一次又一次離開神，神就興起一些「士師」來拯救他們。</p>
  <p>士師不是法官，比較像<b>臨時被神叫出來的救援隊長</b>：有農夫、有女先知、有左撇子、有大力士，每一個都不完美。</p>${cycleSVG()}
  <p>每一頁漫畫下面都是真的和合本經文。看漫畫的時候順便讀那兩三句，就讀完一章了。</p></details>
 <p class="note" style="text-align:center">經文：和合本。進度只存在這台裝置。<br>iPhone 用 Safari 的「分享 → 加入主畫面」，打開就是全螢幕。<br><a href="https://goodskang.tw/" style="color:#e8c983">阿康爸的平安科技日常 goodskang.tw</a></p></div>`;}
function cycleSVG(){const s=["離開神","被欺壓","呼求神","神拯救","享太平"],c=["#b8452a","#7a4a8a","#3f6a8a","#c9a35a","#4a8a5a"];let g="";
 s.forEach((t,i)=>{const a=-Math.PI/2+i*2*Math.PI/5,x=160+Math.cos(a)*96,y=124+Math.sin(a)*88;g+=`<circle cx="${x}" cy="${y}" r="36" fill="${c[i]}"/><text x="${x}" y="${y+6}" text-anchor="middle" font-family="Noto Serif TC" font-weight="700" font-size="16" fill="#fff">${t}</text>`;});
 return `<svg class="cycle" viewBox="0 0 320 250" role="img" aria-label="離開神、被欺壓、呼求神、神拯救、享太平，一再循環"><circle cx="160" cy="124" r="94" fill="none" stroke="#5a4a33" stroke-width="2" stroke-dasharray="5 6"/>${g}<text x="160" y="120" text-anchor="middle" font-family="Noto Serif TC" font-size="13" fill="#a8977a">一輪</text><text x="160" y="138" text-anchor="middle" font-family="Noto Serif TC" font-size="13" fill="#a8977a">比一輪糟</text></svg>`;}

 if(d.ill){let h=`<div class="panel ill ${fx.includes("shake")?"fx-shake":""}"><img class="illimg" alt="" src="${d.ill}" decoding="async" ${R.mode==="scroll"?'loading="lazy"':""} draggable="false">`;

 if(gr==="in")h+=`<div class="wall"></div><div class="gnd in"></div>`;else h+=`<div class="gnd" style="background-image:url(${A.gtex[{m:"meadow",f:"forest",r:"road",a:"ash"}[gr]]})"></div>`;
 if(fx.includes("rays"))h+=`<div class="fx fx-rays"></div>`;if(fx.includes("speed"))h+=`<div class="fx fx-speed"></div>`;

 const pos=[];cast.forEach((s,i)=>{let [key,x,hh]=s.split(" ");const fl=key[0]==="~";if(fl)key=key.slice(1);x=+x;hh=+(hh||DH[key]||58);pos.push([x,hh]);
  const cls=`c ${fl?"fl":""} ${x>50?"fr":""}`;const st=`left:${x}%;height:${hh}%;--d:${(i*.18).toFixed(2)}s`;
  if(CREA[key]){const src=COVER[CREA[key]];h+=src?`<img class="${cls}" alt="" src="${src}" style="${st}">`:`<span class="${cls} emo" style="left:${x}%;--d:${i*.18}s">${EMO[key]}</span>`;}

function gameHTML(n,g,k){const s=st(n),G=gs(n,k),solved=!!s.games[k];let b="",q=g.q;

  if(fin)b+=`<div class="gfb"><b>排好了！</b><br>${g.w}</div>`;}
 else if(g.g==="mash"){const c=G.c||0,fin=c>=g.n;b+=`<div class="mash"><button class="tgt" data-gm="${k}" aria-label="連點">${COVER[g.img]?`<img alt="" src="${COVER[g.img]}" draggable="false">`:`<span style="font-size:110px">${EMO[g.img]}</span>`}</button><div class="meter"><i style="width:${Math.min(100,c/g.n*100)}%"></i></div><div class="mlab">${fin?"成功！":g.label}</div></div>${fin?`<div class="gfb">${g.done}</div>`:""}`;}
 else if(g.g==="battle"){const won=!!s.ch;q=`換你上場：${BTITLE[g.k]}`;b+=`<button class="btcard" data-battle="${g.k}"><div class="art" style="background-image:url(${coverURL(BCOVER[g.k])})"></div><em>${won?"再打一次":"點我開打"}</em><span>⚔ ${BTITLE[g.k]}</span></button><p class="bhelp">點畫面上的敵人，主角就會衝過去攻擊；能量滿了按右下角的大按鈕。${won?"<br><b>✓ 已經打贏過了！</b>":""}</p>`;}

function endHTML(n){const c=CH[n-1],e=EASY[n],s=st(n),V=JDG[n-1];

let PW=0,PH=0,BLEED=false,UIT=0;const NS=16;

function layout(){const S=$("stage"),W=S.clientWidth||innerWidth,H=S.clientHeight||innerHeight;R.spread=R.mode==="flip"&&W>=760&&W/H>1.12;

function norm(i){if(R.spread)i=i-(i%2);return Math.max(0,Math.min(i,lastIdx()));}
function lastIdx(){const L=R.pages.length-1;return R.spread?L-(L%2):L;}

  if(side==="R"){s.style.left=(i?w:0)+"px";s.style.transformOrigin="0 50%";}else{s.style.left=(i?-w:PW-w)+"px";s.style.transformOrigin="100% 50%";}
  const mk=(src,off,cls)=>{const f=document.createElement("div");f.className="f "+cls;const hold=document.createElement("div");hold.className="hold";hold.style.width=PW+"px";hold.style.left=(-off)+"px";

  const fo=side==="R"?i*w:(NS-1-i)*w,bo=side==="R"?(NS-1-i)*w:i*w;

function setP(p){const f=FL;if(!f)return;f.p=p;const q=f.rev?1-p:p,LAG=.3,sg=f.side==="R"?-1:1;let prev=0,x=0,pF=0,pB=0;
 const col=v=>v>=0?`rgba(0,0,0,${v.toFixed(3)})`:`rgba(255,255,255,${(-v).toFixed(3)})`;
 for(let i=0;i<NS;i++){const u=(i+1)/NS,a=180*Math.max(0,Math.min(1,q*(1+LAG)-LAG*(1-u))),s=f.strips[i],rad=a*Math.PI/180,bend=(a-prev)/(180/NS*1.6);
  s.el.style.transform=`rotateY(${(sg*(a-prev)).toFixed(2)}deg)`;
  // 正值＝變暗、負值＝反光；每一條從上一條的亮度漸變到自己的亮度，接縫才看不出來
  const vF=Math.sin(Math.min(rad,Math.PI/2))*.5-Math.min(.22,bend*.3),vB=Math.max(0,Math.sin(rad))*.34-Math.min(.25,bend*.35);
  s.shF.style.background=`linear-gradient(${f.side==="R"?90:270}deg,${col(i?pF:vF)},${col(vF)})`;
  s.shB.style.background=`linear-gradient(${f.side==="R"?270:90}deg,${col(i?pB:vB)},${col(vB)})`;
  pF=vF;pB=vB;x+=Math.cos(rad)*PW/NS;prev=a;}
 // 紙落在下面那頁的影子，跟著紙邊走
 const lift=Math.sin(Math.PI*q),base=f.side==="R"?parseFloat(f.leaf.style.left):PW,edge=f.side==="R"?base+x:base-x;
 f.cast.style.opacity=(lift*.85).toFixed(3);f.cast.style.left=(f.side==="R"?Math.min(edge,base)-10:Math.min(edge,base))+"px";f.cast.style.width=(Math.abs(x)+50+lift*40)+"px";
 f.cast.style.background=`linear-gradient(${edge>base?90:270}deg,rgba(0,0,0,.05),rgba(0,0,0,.45) 70%,rgba(0,0,0,0))`;
 f.under.forEach((u,j)=>{const s=u.querySelector(".shade");if(s)s.style.opacity=((1-q)*.35*(j===f.under.length-1?1:0)).toFixed(3);});
 if(!R.spread)f.leaf.style.opacity=q>.82?Math.max(0,(1-q)/.18).toFixed(3):1;}
const easeIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,easeO=k=>1-Math.pow(1-k,3);
function animP(to,done,tap){const f=FL;if(!f)return;const from=f.p,t0=performance.now(),D=tap?430:Math.max(150,Math.abs(to-from)*340),E=tap?easeIO:easeO;
 const step=now=>{if(FL!==f)return;const k=Math.min(1,(now-t0)/D);setP(from+(to-from)*E(k));if(k<1)requestAnimationFrame(step);else done();};requestAnimationFrame(step);}
function finishFlip(tap){const f=FL;if(!f)return;animP(1,()=>{R.i+=f.dir*f.step;FL=null;renderBook(true);},tap);}
function cancelFlip(){const f=FL;if(!f)return;animP(0,()=>{FL=null;renderBook(false);});}
function go(dir){if(R.mode==="scroll"){const S=$("stage");S.scrollBy({top:dir*S.clientHeight*.85,behavior:"smooth"});return;}if(FL)return;if(!canGo(dir)){bump(dir);return;}au();if(beginFlip(dir))finishFlip(true);}
function bump(dir){const b=$("stage").querySelector(".book");if(!b)return;b.animate([{transform:"translateX(0)"},{transform:`translateX(${-dir*14}px)`},{transform:"translateX(0)"}],{duration:260});}
// 拖曳翻頁：紙跟著手指走
let DR=null;const NOFLIP="button,textarea,a,summary,input";
$("stage").addEventListener("pointerdown",e=>{if(R.mode==="scroll"||FL)return;if(e.target.closest(NOFLIP))return;DR={x:e.clientX,y:e.clientY,t:performance.now(),on:false,id:e.pointerId,lx:e.clientX,lt:performance.now(),v:0};});
$("stage").addEventListener("pointermove",e=>{if(!DR||DR.id!==e.pointerId)return;const dx=e.clientX-DR.x,dy=e.clientY-DR.y,now=performance.now();
 if(!DR.on){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.2){const dir=dx<0?1:-1;if(!canGo(dir)){DR=null;bump(dir);return;}au();if(!beginFlip(dir)){DR=null;return;}DR.on=true;DR.x=e.clientX;try{$("stage").setPointerCapture(e.pointerId);}catch(_){}}else if(Math.abs(dy)>14){DR=null;}return;}
 if(now>DR.lt){DR.v=(e.clientX-DR.lx)/(now-DR.lt);DR.lx=e.clientX;DR.lt=now;}
 const w=R.spread?PW*1.7:PW*1.15;setP(Math.max(0,Math.min(1,Math.abs(e.clientX-DR.x)/w)));});
const endDrag=e=>{if(!DR)return;const d=DR;DR=null;if(!d.on||!FL)return;const fwd=FL.dir>0?-d.v:d.v;if(fwd>.35||(FL.p>.3&&fwd>-.25))finishFlip();else cancelFlip();};
$("stage").addEventListener("dragstart",e=>e.preventDefault());
$("stage").addEventListener("pointerup",endDrag);$("stage").addEventListener("pointercancel",e=>{if(DR&&DR.on)cancelFlip();DR=null;});
// 點兩側翻頁、點中間叫出或收起工具列
$("stage").addEventListener("click",e=>{if(FL)return;if(e.target.closest(NOFLIP+",details"))return;if(R.mode==="scroll")return;const b=$("stage").querySelector(".book");if(!b)return;const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
 if(x<.25)go(-1);else if(x>.75)go(1);else if(!e.target.closest(".vbox,.gm,.endp"))showUI(!$("reader").classList.contains("ui"));});
document.addEventListener("keydown",e=>{if(!$("reader").classList.contains("on")||$("bt").classList.contains("on")||e.target.tagName==="TEXTAREA")return;if($("deep").classList.contains("on")&&e.key!=="Escape")return;if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();go(1);}if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(-1);}if(e.key==="Escape"){if($("deep").classList.contains("on"))closeDeep();else closeBook();}});
$("rprev").onclick=()=>{go(-1);showUI(true);};$("rnext").onclick=()=>{go(1);showUI(true);};$("rhome").onclick=()=>closeBook();
$("rmode").onclick=()=>{R.mode=R.mode==="flip"?"scroll":"flip";SAVE.mode=R.mode;save();renderBook(true);showUI(true);};
$("rfull").onclick=()=>{try{const d=document;if(d.fullscreenElement)d.exitFullscreen();else{const p=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast("這裡不能切全螢幕，裝成 App 後就是滿版"));else if(!p)toast("這裡不能切全螢幕，裝成 App 後就是滿版");}}catch(_){toast("這裡不能切全螢幕，裝成 App 後就是滿版");}};
let RT=0;window.addEventListener("resize",()=>{clearTimeout(RT);RT=setTimeout(()=>{if($("reader").classList.contains("on")&&!FL&&!$("bt").classList.contains("on"))renderBook(false);},150);});
// 只重畫目前看得到的頁面（小遊戲用）
function refresh(k){const el=$("stage").querySelector(`.pg[data-k="${k}"]`);if(!el)return;const sc=el.querySelector(".gbody,.ebody");const top=sc?sc.scrollTop:0;const n=pageEl(k,false);n.classList.add("play");if(R.mode==="scroll")n.style.width=el.style.width;el.replaceWith(n);const s2=n.querySelector(".gbody,.ebody");if(s2)s2.scrollTop=top;}
function renderChallenge(){const k=R.pages.findIndex(p=>p.t==="game"&&p.d.g==="battle");if(k>=0){if(st(R.n).ch)solve(k,true);refresh(k);}}
function solve(k,quiet){const P=R.pages[k];if(!P||P.t!=="game")return;const s=st(R.n);if(!s.games[P.k]){s.games[P.k]=1;save();if(!quiet){sfx("ok");confetti();}}}
let BTP=null;
function loadBattle(){if(BTP)return BTP;toast("戰鬥載入中…");const ld=src=>new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.body.appendChild(e);});
 BTP=ld("assets.js").then(()=>{A=window.ASSET;return ld("battle.js");});BTP.catch(()=>{BTP=null;});return BTP;}
function openDeep(n){const c=CH[n-1],D=window.DEEP[n],L=D.s.length;
 let h=`<button class="dx" data-deepx="1" aria-label="關閉深度解析">✕</button><div class="dwrap"><div class="dhead" style="background-image:url(${coverURL(n)})"><small>士師記 第 ${n} 章・深度解析</small><h1>${c.title}</h1></div><div class="dbody"><div class="dlead">${D.lead}</div>`;
 D.s.forEach(([t,...ps],i)=>{h+=`<div class="dsec ${i===L-1?"last":""}"><h3><i>${i+1}</i>${t}</h3>${ps.map(p=>`<p>${p}</p>`).join("")}</div>`;});
 h+=`<div class="dmore">${c.tbl?`<h3>一張表看懂</h3><table><thead><tr>${c.tbl.h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${c.tbl.r.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table>`:""}
 <h3>聖經其他地方怎麼說</h3>${c.d4.refs.map(([r,t])=>`<div class="rf"><b>${r}</b>${t}</div>`).join("")}</div>
 <button class="btn pri wide" data-deepx="1" style="margin-top:18px">看完了，回到漫畫</button></div></div>`;
 const el=$("deep");el.innerHTML=h;el.classList.add("on");el.scrollTop=0;}
function closeDeep(){$("deep").classList.remove("on");$("deep").innerHTML="";}
// ================= 點擊 =================
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;au();const pg=b.closest(".pg"),k=pg?+pg.dataset.k:-1;
 if(b.dataset.open){if($("reader").classList.contains("on")){openBook(b.dataset.open);}else openBook(b.dataset.open);return;}
 if(b.dataset.deep){openDeep(R.n);return;}
 if(b.dataset.deepx){closeDeep();return;}
 if(b.dataset.home){closeBook();return;}
 if(b.dataset.mode){R.mode=b.dataset.mode;SAVE.mode=R.mode;save();renderHome();return;}
 const P=R.pages[k];
 if(b.dataset.gc!==undefined){const G=gs(R.n,b.dataset.gc);if(G.ans!==undefined)return;G.ans=+b.dataset.o;if(G.ans===0)solve(k);else sfx("bad");refresh(k);return;}
 if(b.dataset.greset!==undefined){const G=gs(R.n,b.dataset.greset);for(const x in G)delete G[x];refresh(k);return;}
 if(b.dataset.gp!==undefined){const G=gs(R.n,b.dataset.gp);if(G.chk)return;const i=+b.dataset.i;G.sel[i]=!G.sel[i];sfx("tick");refresh(k);return;}
 if(b.dataset.gpchk!==undefined){const G=gs(R.n,b.dataset.gpchk);G.chk=1;const good=P.d.items.every(([t,ok],i)=>!!ok===!!G.sel[i]);if(good)solve(k);else sfx("bad");refresh(k);return;}
 if(b.dataset.go2!==undefined){const G=gs(R.n,b.dataset.go2);const i=+b.dataset.i;if(i<G.got)return;if(i===G.got){G.got++;G.bad=-1;sfx("pop");if(G.got===P.d.items.length)solve(k);}else{G.bad=i;sfx("bad");}refresh(k);return;}
 if(b.dataset.gm!==undefined){const G=gs(R.n,b.dataset.gm);G.c=(G.c||0)+1;if(G.c>P.d.n)return;sfx(G.c===P.d.n?"crit":"hit");if(G.c===P.d.n){solve(k);refresh(k);return;}const m=pg.querySelector(".meter i");if(m)m.style.width=(G.c/P.d.n*100)+"%";b.classList.remove("hit");void b.offsetWidth;b.classList.add("hit");return;}
 if(b.dataset.battle){loadBattle().then(()=>startBattle(b.dataset.battle),()=>toast("戰鬥載入失敗，請檢查網路再試一次"));return;}
 if(b.dataset.copy){const e=EASY[R.n],t=`「${JDG[R.n-1][e.key-1]}」（士師記 ${R.n}:${e.key}）`;try{navigator.clipboard.writeText(t).then(()=>toast("已複製"),()=>toast("無法複製，請長按經文"));}catch(_){toast("無法複製，請長按經文");}return;}
 if(b.dataset.finish){const s=st(R.n);const t=document.getElementById("note");if(t)s.note=t.value;s.done=1;s.page=0;if(!SAVE.days.includes(today()))SAVE.days.push(today());save();sfx("win");confetti();toast(doneCount()===21?"士師記 21 章全部讀完！":`第 ${R.n} 章完成・連續 ${streak()} 天`);refresh(k);return;}
});
document.addEventListener("input",e=>{if(e.target.id==="note"&&R.n){st(R.n).note=e.target.value;save();}});
</script>
