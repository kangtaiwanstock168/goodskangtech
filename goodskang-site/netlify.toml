[build]
  command = "node build.js"
  publish = "dist"
  functions = "netlify/functions"
  # 只有 goodskang-site/ 裡有東西改才重建;kdh-site 的 commit 不再讓這個站白跑一次(每次部署 15 點)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "20"

# 每天台北時間 06:10 自動重建一次(2026-10-28 起由一天兩次改成一次,省部署點數);實際由 GitHub Actions daily-rebuild 觸發
[functions."daily"]
  schedule = "10 22 * * *"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 舊網址 goodskangtech.netlify.app 一律 301 轉到正式網域 goodskang.tw
[[redirects]]
from = "https://goodskangtech.netlify.app/*"
to = "https://goodskang.tw/:splat"
status = 301
force = true
