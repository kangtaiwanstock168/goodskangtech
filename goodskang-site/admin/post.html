<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>📮 阿康投稿</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--gold:#d29922;--red:#f85149;--green:#3fb950}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}h1{font-size:1.3rem;margin:6px 0 14px}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:.92rem}
input,textarea,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:1rem}
textarea{min-height:260px;line-height:1.7}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#0d1117;font-weight:800;font-size:1.05rem;cursor:pointer;margin-top:14px}
.btn.o{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.hint{color:var(--muted);font-size:.82rem;margin-top:4px}
.msg{margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:none;white-space:pre-wrap}
.ok{border-color:var(--green)}.err{border-color:var(--red)}
#prev{margin-top:12px;padding:14px;border:1px dashed var(--border);border-radius:10px;display:none}
#prev img{max-width:100%;border-radius:10px}
.thumb{margin-top:8px;max-height:160px;border-radius:10px;display:none}
</style></head><body><div class="wrap">
<h1>📮 阿康投稿——貼上就發布</h1>
<p class="hint">寫完按「發布」→ 自動寫進 GitHub → Netlify 重建 → 1~2 分鐘後文章上線(首頁、科技快訊、RSS、llms.txt 全部同步)。手機也能用。</p>
<label>投稿密碼</label><input id="key" type="password" placeholder="Netlify 環境變數 PUBLISH_KEY" autocomplete="current-password">
<label>標題 *</label><input id="title" placeholder="例:iPhone 18 Pro 首週銷量出爐:Pro Max 佔六成">
<div class="row"><div><label>分類</label><select id="category"><option>iPhone</option><option>Apple</option><option>特斯拉</option><option>3C 配件</option><option selected>AI 與科技</option><option>台股 AI 工具</option><option>生活</option></select></div><div><label>日期(留空=今天)</label><input id="date" type="date"></div></div>
<label>標籤(逗號分隔)</label><input id="tags" placeholder="iPhone 18 Pro, Apple, 蘋果">
<label>內文 *(直接貼 IG/FB 的文字;支援 # 標題、- 清單、**粗體**、貼 YouTube 連結會自動嵌入)</label><textarea id="body" placeholder="把今天 IG / FB 的貼文內容整段貼進來就好"></textarea>
<label>一句話摘要(留空=自動取前 120 字)</label><input id="summary">
<div class="row"><div><label>YouTube 連結(選填,會嵌入影片並自動當封面)</label><input id="youtube" placeholder="https://youtu.be/..."></div><div><label>封面圖網址(選填)</label><input id="cover" placeholder="https://..."></div></div>
<label>或上傳封面圖(手機相簿選一張,會自動縮到 1280px)</label><input id="file" type="file" accept="image/*"><img id="thumb" class="thumb">
<div class="row"><div><label>IG 貼文連結(選填,文章底部嵌入)</label><input id="ig" placeholder="https://www.instagram.com/p/..."></div><div><label>FB 貼文連結(選填)</label><input id="fb" placeholder="https://www.facebook.com/..."></div></div>
<button class="btn o" type="button" onclick="preview()">👀 預覽</button>
<div id="prev"></div>
<button class="btn" id="go" type="button" onclick="publish()">🚀 發布</button>
<div id="msg" class="msg"></div>
<script>
const $ = id => document.getElementById(id);
try{ $('key').value = localStorage.getItem('pubKey') || ''; }catch(e){}
let imgData = null;
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image(); const url = URL.createObjectURL(f);
  img.onload = () => { const s = Math.min(1, 1280 / img.width); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const b64 = c.toDataURL('image/jpeg', .86); imgData = {type: 'image/jpeg', base64: b64}; $('thumb').src = b64; $('thumb').style.display = 'block'; URL.revokeObjectURL(url); };
  img.src = url;
});
function mdLite(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').split('\n').map(l => l.match(/^#+\s/) ? `<h3>${l.replace(/^#+\s/, '')}</h3>` : l.match(/^\s*[-*]\s/) ? `<li>${l.replace(/^\s*[-*]\s/, '')}</li>` : l.trim() ? `<p>${l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}</p>` : '').join(''); }
function preview(){ const p = $('prev'); p.style.display = 'block'; const yt = ($('youtube').value.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/) || [])[1]; const cover = imgData ? imgData.base64 : ($('cover').value || (yt ? `https://i.ytimg.com/vi/${yt}/hqdefault.jpg` : ''));
  p.innerHTML = `<h2 style="margin:0 0 6px;">${$('title').value || '(標題)'}</h2><div class="hint">${$('category').value}・${$('tags').value}</div>${cover ? `<img src="${cover}">` : ''}${mdLite($('body').value)}`; }
async function publish(){
  const msg = $('msg'), btn = $('go'); msg.style.display = 'block'; msg.className = 'msg'; msg.textContent = '⏳ 發布中…'; btn.disabled = true;
  try{ localStorage.setItem('pubKey', $('key').value); }catch(e){}
  const payload = {key: $('key').value, title: $('title').value, body: $('body').value, category: $('category').value, tags: $('tags').value, date: $('date').value, summary: $('summary').value, youtube: $('youtube').value, cover: $('cover').value, ig: $('ig').value, fb: $('fb').value, image: imgData};
  try{
    const r = await fetch('/.netlify/functions/publish', {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(payload)});
    const j = await r.json();
    if(!r.ok || j.error){ msg.className = 'msg err'; msg.textContent = '❌ ' + (j.error || r.status); }
    else { msg.className = 'msg ok'; msg.innerHTML = `✅ 已送出!${j.note}<br>文章網址:<a href="${j.url}" style="color:var(--accent)">${location.origin}${j.url}</a>`; ['title','body','tags','summary','youtube','cover','ig','fb'].forEach(i => $(i).value = ''); imgData = null; $('thumb').style.display = 'none'; $('file').value = ''; }
  }catch(e){ msg.className = 'msg err'; msg.textContent = '❌ ' + e.message; }
  btn.disabled = false;
}
</script></div></body></html>
